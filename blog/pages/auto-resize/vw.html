<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/normalize.css" />
    <style>
      html {
        font-size: 13.33333vw;
      }
      body{
        font-size: 14px;
      }
      .app {
        background-color: #eee;
      }
      .title {
        font-size: 6.66666vw;
        height: 16vw;
        line-height: 16vw;
        text-align: center;
      }
      .banner {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32vw;
        background-color: #999;
      }
      .section {
        display: flex;
      }
      .section > div {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 33.3333vw;
        height: 33.3333vw;
      }
      .red {
        background-color: red;
      }
      .yellow {
        background-color: yellow;
      }
      .blue {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="title">设计稿 750 x 1334</div>
      <div class="banner">banner 750 x 240</div>
      <div class="section">
        <div class="red">红 250x250</div>
        <div class="yellow">绿 250x250</div>
        <div class="blue">蓝色 250x250</div>
      </div>
    </div>
  </body>
</html>
