<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="../styles/normalize.css" />
  <style>
    :root {
      --ideal-viewport-width: 750;
      --current-viewport-width: 100vw;
      --min-viewport-width: 320px;
      --max-viewport-width: 750px;
      --clamped-viewport-width: clamp(var(--min-viewport-width),
          var(--current-viewport-width),
          var(--max-viewport-width));
    }

    html {
      font-size: calc(var(--clamped-viewport-width) * 100 / var(--ideal-viewport-width));
      max-width: var(--max-viewport-width);
      margin: auto;
      min-height: 100vh;
      position: relative;
      /* will-change: transform; */
      transform: translateZ(0);
    }

    body {
      font-size: 14px;
    }

    .app {
      background-color: #eee;
    }

    .title {
      font-size: 0.5rem;
      height: 1.2rem;
      line-height: 1.2rem;
      text-align: center;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 7.5rem;
      height: 2.4rem;
      background-color: #999;
    }

    .section {
      display: flex;
    }

    .section>div {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
    }

    .red {
      background-color: red;
    }

    .yellow {
      background-color: yellow;
    }

    .blue {
      background-color: blue;
    }

    .back-to-top {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 1.2rem;
      height: 1.2rem;
      background-color: #999;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">设计稿 750 x 1334</div>
    <div class="banner">banner 750 x 240</div>
    <div class="section">
      <div class="red">红 250x250</div>
      <div class="yellow">绿 250x250</div>
      <div class="blue">蓝色 250x250</div>
    </div>
  </div>
  <div>
    <pre>

      使用了

      position: relative;
      /* will-change: transform; */
      transform: translateZ(0);
      
      保持固定定位元素在容器之内
      
    </pre>

  </div>
  <div class="back-to-top">返回顶部</div>
</body>

</html>
